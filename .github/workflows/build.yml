name: build

# Everything is generated from this repository: no assets to commit, no local
# Godot install needed. On a v* tag the workflow builds Web, Linux, Windows and
# macOS and publishes them as a release; on main it also deploys the web build
# to GitHub Pages.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  GODOT_VERSION: "4.3"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Headless tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: bash tools/ci_install_godot.sh "$GODOT_VERSION" 0
      - name: Import project
        run: godot --headless --path . --import
      - name: Smoke test
        run: godot --headless --path . res://scenes/TestRunner.tscn
      - name: Soak test
        run: godot --headless --path . res://scenes/tools/SoakTest.tscn

  web:
    name: Web build (PWA)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and export templates
        run: bash tools/ci_install_godot.sh "$GODOT_VERSION" 1
      - name: Import project
        run: godot --headless --path . --import
      - name: Export web
        run: |
          # .gdignore keeps the importer out of build/, otherwise the exported
          # PNGs get imported back into the project on the next scan.
          mkdir -p build/web
          touch build/.gdignore
          godot --headless --path . --export-release "Web" build/web/index.html
      - name: Patch PWA shell
        run: python3 tools/pwa_post_export.py build/web
      - name: Package
        run: |
          cd build/web
          zip -q -r ../neon-velocity-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web
      - uses: actions/upload-artifact@v4
        with:
          name: web-zip
          path: build/neon-velocity-web.zip

  pages:
    name: Deploy to GitHub Pages
    needs: web
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: public
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4

  desktop:
    name: Export ${{ matrix.preset }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Linux/X11
            out: build/linux/NeonVelocity.x86_64
            artifact: neon-velocity-linux
          - preset: Windows Desktop
            out: build/windows/NeonVelocity.exe
            artifact: neon-velocity-windows
          - preset: macOS
            out: build/macos/NeonVelocity.zip
            artifact: neon-velocity-macos
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and export templates
        run: bash tools/ci_install_godot.sh "$GODOT_VERSION" 1
      - name: Import project
        run: godot --headless --path . --import
      - name: Export
        run: |
          mkdir -p "$(dirname "${{ matrix.out }}")"
          touch build/.gdignore
          godot --headless --path . --export-release "${{ matrix.preset }}" "${{ matrix.out }}"
      - name: Package
        run: |
          cd "$(dirname "${{ matrix.out }}")"
          zip -q -r "../../${{ matrix.artifact }}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.artifact }}.zip

  release:
    name: Publish release
    needs: [web, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect
        run: |
          mkdir -p dist
          find artifacts -name '*.zip' -exec cp {} dist/ \;
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
          body: |
            Neon Velocity ${{ github.ref_name }}

            - `neon-velocity-web.zip` - the browser/PWA build. Unzip and serve over
              HTTPS (or localhost); it installs as an app and works offline after
              the first load.
            - `neon-velocity-windows.zip` - unzip and run `NeonVelocity.exe`.
            - `neon-velocity-linux.zip` - unzip, `chmod +x`, run the binary.
            - `neon-velocity-macos.zip` - unzip and run the `.app` (unsigned: right
              click, Open, the first time).
