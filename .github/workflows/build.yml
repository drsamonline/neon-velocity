name: build

# Everything is generated from this repository: no assets to commit, no local
# Godot install needed.
#
#   push / PR        headless smoke test + 50 s soak test
#   push to main     the above, then the landing page and the Web build are
#                    published to GitHub Pages (/ and /play/)
#   v* tag           the above, then Web, Linux, Windows and macOS are built and
#                    attached straight to a GitHub release
#   manual dispatch  same as a tag, without publishing a release
#
# Deliberately no upload-artifact/download-artifact: each job attaches its own
# file to the release, so the pipeline works even when the account's Actions
# artifact quota is full.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

env:
  GODOT_VERSION: "4.3"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Headless tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - name: Install Godot
        run: bash tools/ci_install_godot.sh "$GODOT_VERSION" 0
      - name: Import project
        run: godot --headless --path . --import
      - name: Smoke test
        run: godot --headless --path . res://scenes/TestRunner.tscn
      - name: Soak test
        run: godot --headless --path . res://scenes/tools/SoakTest.tscn

  web:
    name: Web build (PWA)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - name: Install Godot and export templates
        run: bash tools/ci_install_godot.sh "$GODOT_VERSION" 1
      - name: Import project
        run: godot --headless --path . --import
      - name: Export web
        run: |
          # .gdignore keeps the importer out of build/, otherwise the exported
          # PNGs get re-imported into the project on the next scan.
          mkdir -p build/web
          touch build/.gdignore
          godot --headless --path . --export-release "Web" build/web/index.html
      - name: Patch PWA shell
        run: python3 tools/pwa_post_export.py build/web
      - name: Package
        run: |
          cd build/web
          zip -q -r ../neon-velocity-web.zip .
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65   # was @v2
        with:
          files: build/neon-velocity-web.zip
          generate_release_notes: true
          body: |
            Neon Velocity ${{ github.ref_name }}

            | File | What to do with it |
            |------|--------------------|
            | `neon-velocity-web.zip` | Unzip and serve the folder over HTTPS or localhost. Installs as an app (PWA) and works offline after the first load. |
            | `neon-velocity-windows.zip` | Unzip, run `NeonVelocity.exe`. |
            | `neon-velocity-linux.zip` | Unzip, `chmod +x NeonVelocity.x86_64`, run it. |
            | `neon-velocity-macos.zip` | Unzip, right click the `.app` then Open (unsigned). |

            Play in the browser: https://drsamonline.github.io/neon-velocity/play/

  pages:
    name: Deploy to GitHub Pages
    needs: web
    # Opt-in: set the repository variable ENABLE_PAGES=true once Pages is enabled
    # with "GitHub Actions" as the source.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - name: Install Godot and export templates
        run: bash tools/ci_install_godot.sh "$GODOT_VERSION" 1
      - name: Import project
        run: godot --headless --path . --import
      - name: Export web
        run: |
          mkdir -p build/web
          touch build/.gdignore
          godot --headless --path . --export-release "Web" build/web/index.html
      - name: Compose the site
        run: |
          # /        -> the landing page from site/
          # /play/   -> the game itself, patched into a PWA
          mkdir -p public
          cp -r site/. public/
          mkdir -p public/play
          cp -r build/web/. public/play/
          python3 tools/pwa_post_export.py public/play --demo
          find public -maxdepth 1 -type f | sort
          find public/play -maxdepth 1 -type f | sort | head -20
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b   # was @v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # was @v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # was @v4

  desktop:
    name: Export ${{ matrix.preset }}
    needs: web
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: Linux/X11
            out: build/linux/NeonVelocity.x86_64
            artifact: neon-velocity-linux
          - preset: Windows Desktop
            out: build/windows/NeonVelocity.exe
            artifact: neon-velocity-windows
          - preset: macOS
            out: build/macos/NeonVelocity.zip
            artifact: neon-velocity-macos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - name: Install Godot and export templates
        run: bash tools/ci_install_godot.sh "$GODOT_VERSION" 1
      - name: Import project
        run: godot --headless --path . --import
      - name: Export
        run: |
          mkdir -p "$(dirname "${{ matrix.out }}")"
          touch build/.gdignore
          godot --headless --path . --export-release "${{ matrix.preset }}" "${{ matrix.out }}"
      - name: Package
        run: |
          cd "$(dirname "${{ matrix.out }}")"
          zip -q -r "$GITHUB_WORKSPACE/build/${{ matrix.artifact }}.zip" .
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65   # was @v2
        with:
          files: build/${{ matrix.artifact }}.zip
